<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Shop</title>
<script src="https://cdn.botpress.cloud.invalid/webchat/v2/inject.js"></script></head>
<body><h1>Fictional shop</h1>
<script>
window.botpress = { open: function () {} };  /* the vendor API exists but shows nothing */
var b = document.createElement('button'); b.setAttribute('aria-label', 'Open chat'); b.textContent = 'Chat';
b.onclick = function () { var d = document.createElement('div'); d.textContent = "Hi, I'm an AI assistant."; document.body.appendChild(d); };
document.body.appendChild(b);
</script></body></html>
