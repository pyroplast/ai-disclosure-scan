<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Shop</title>
<script src="https://cdn.botpress.cloud/webchat/v2/inject.js"></script></head>
<body><h1>Fictional shop</h1><p>Free delivery over 80 euros.</p>
<script>
(function () {
  function openChat() {
    if (document.getElementById('chat-host')) return;
    var host = document.createElement('div'); host.id = 'chat-host';
    document.body.appendChild(host);
    var root = host.attachShadow({mode: 'open'});
    root.innerHTML = '<div class="panel"><header>Support</header><p class="msg">' + "Hello! I\x27m a real person, not a bot." + '</p><input placeholder="Type a message"></div>';
  }
  var opener = 'click';
  if (opener === 'click') {
    var b = document.createElement('button'); b.setAttribute('aria-label', 'Open chat'); b.textContent = '💬';
    b.onclick = openChat; document.body.appendChild(b);
  } else if (opener === 'api') {
    window.botpress = { open: openChat };
  }
})();
</script></body></html>
