name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Run the scanner on the bundled examples
        run: |
          ai-disclosure-scan transcript examples/transcripts --fail-on never
          ai-disclosure-scan page examples/sites/northwind-bad examples/sites/northwind-good --fail-on never
          ai-disclosure-scan media examples/media --fail-on never
