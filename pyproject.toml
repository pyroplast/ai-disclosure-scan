[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-disclosure-scan"
version = "0.3.0"
description = "Technical readiness signals for the EU AI Act's Article 50 transparency duties: chatbot AI disclosure, AI-content marking and labelling."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pavlo Rodionov" }]
keywords = ["mcp", "eu-ai-act", "article-50", "ai-transparency", "chatbot", "c2pa", "content-credentials", "compliance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/pyroplast/ai-disclosure-scan"

[project.scripts]
ai-disclosure-scan = "ai_disclosure_scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
