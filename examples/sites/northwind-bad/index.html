<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Northwind Outdoors: gear for the long way round</title>
  <meta name="description" content="Tents, packs and boots for people who walk further.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Fictional shop used as a scanner example. Nothing here is a real company. -->
</head>
<body>
  <header>
    <h1>Northwind Outdoors</h1>
    <nav><a href="#tents">Tents</a> <a href="#packs">Packs</a> <a href="#help">Help</a></nav>
  </header>

  <main>
    <section id="hero">
      <img src="img/hero.png" alt="A lighthouse on a cliff at dusk" width="480" height="300">
      <h2>Walk further this autumn</h2>
      <p>New season packs are in. Free delivery on orders over €80.</p>
    </section>

    <section id="team">
      <img src="img/team.png" alt="The Northwind team" width="240" height="160">
      <p>We are twelve people in a warehouse outside Girona.</p>
    </section>

    <section id="help">
      <h2>Questions?</h2>
      <p>Sarah is online and happy to help. Click the bubble in the corner.</p>
    </section>
  </main>

  <script src="https://cdn.botpress.cloud/webchat/v2.2/inject.js"></script>
  <script>
    window.botpress && window.botpress.init({
      botName: "Sarah",
      greeting: "Hi, I'm Sarah! How can I help you today?",
      avatarUrl: "/img/sarah.jpg"
    });
  </script>
</body>
</html>
